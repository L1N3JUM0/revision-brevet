<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0e0e14">
  <title>Maths — Révision brevet</title>
  <link rel="stylesheet" href="../assets/css/base.css">
</head>
<body class="matiere-maths">
  <main class="page">
    <header class="barre-haut">
      <a class="btn-icone" href="../index.html" aria-label="Accueil">‹</a>
      <div class="titre">📐 Maths</div>
    </header>

    <a class="carte carte-lien carte-controle" href="controle.html">
      <span class="pastille">📝</span>
      <span class="corps"><strong>Contrôle blanc</strong><span class="doux petit">Sujet mélangé, barème, correction à la fin</span></span>
      <span class="chevron">›</span>
    </a>
    <p class="doux">Ou choisis un chapitre : cours flash, entraînement et défi chrono.</p>
    <div id="liste"></div>
  </main>

  <script type="module">
    import { CHAPITRES } from './chapitres.js';
    import { charger } from '../assets/js/core/store.js';
    import { esc } from '../assets/js/ui/dom.js';

    const { chapitres, badges } = charger();
    document.getElementById('liste').innerHTML = CHAPITRES.map(ch => {
      const dispo = !!ch.charger;
      const st = chapitres[ch.id];
      let info = dispo ? 'Pas encore commencé' : 'Bientôt';
      if (dispo && st && st.total > 0) {
        info = `${st.bonnes} bonne${st.bonnes > 1 ? 's' : ''} réponse${st.bonnes > 1 ? 's' : ''} · ${Math.round((st.bonnes / st.total) * 100)} % de réussite`;
      }
      const badge = badges.includes(ch.id) ? ' <span class="badge badge-or">🏅 Maîtrisé</span>' : '';
      const balise = dispo ? 'a' : 'div';
      const href = dispo ? ` href="chapitre.html?c=${encodeURIComponent(ch.id)}"` : '';
      return `<${balise} class="carte carte-lien${dispo ? '' : ' inactive'}"${href}>
        <span class="pastille">${esc(ch.emoji)}</span>
        <span class="corps"><strong>${esc(ch.titre)}${badge}</strong><span class="doux petit">${info}</span></span>
        ${dispo ? '<span class="chevron">›</span>' : ''}
      </${balise}>`;
    }).join('');
  </script>
</body>
</html>
